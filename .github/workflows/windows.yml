# Windows-CI (Phase 6a): Tests, Typprüfung, Rust-Tests und Installer auf windows-latest; Lizenzen auf Linux (günstiger).
name: windows
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lizenzen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
  # CDR-Hilfsprozess (Phase 6c): libcdr statisch in MSYS2 bauen; die App bündelt ihn über bundle.externalBin.
  cdr:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: make m4 curl bzip2 xz
          pacboy: gcc:p boost:p lcms2:p zlib:p icu:p pkgconf:p
      - name: kw-cdr.exe bauen
        run: sh src/cdr-import/build.sh
      - name: kw-cdr.exe prüfen (nur System-DLLs, liest die Testdatei)
        run: |
          cd src/cdr-import/.build/bin
          DLLS=$(objdump -p kw-cdr.exe | grep "DLL Name")
          echo "$DLLS"
          if echo "$DLLS" | grep -qiE "lib|icuuc|icuin|icudt"; then echo "fremde DLL" >&2; exit 1; fi
          ./kw-cdr.exe ../../../../tests/fixtures/cdr/fdo65220-2.cdr > probe.svg
          ls -l kw-cdr.exe; head -c 300 probe.svg; echo
          grep -q "<svg" probe.svg
          rm probe.svg
      - uses: actions/upload-artifact@v7
        with:
          name: kw-cdr-windows
          path: src/cdr-import/.build/bin/
          retention-days: 14
  windows:
    needs: cdr
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: kw-cdr-windows
          path: src/cdr-import/.build/bin
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Ab hier laufen alle Schritte, auch wenn einer davor scheitert: ein Lauf zeigt alle Windows-Befunde.
      - name: vitest
        if: ${{ !cancelled() }}
        run: npx vitest run --reporter=dot
      - name: svelte-check
        if: ${{ !cancelled() }}
        run: npm run -s check
      - name: Oberfläche bauen (dist für Rust-Tests)
        if: ${{ !cancelled() }}
        run: npm run -s build
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --workspace
      - name: CDR-Import mit Testdatei (auch Pfad mit Ω)
        if: ${{ !cancelled() }}
        run: cargo test -p konturwerk cdr -- --ignored
      - name: Installer bauen
        if: ${{ !cancelled() }}
        run: npx tauri build
      - name: Installer enthält kw-cdr.exe
        if: ${{ !cancelled() }}
        run: |
          $l = 7z l (Get-Item target/release/bundle/nsis/*.exe).FullName
          if (-not ($l | Select-String 'kw-cdr\.exe')) { $l; exit 1 }
      # Phase 6d: fertige App wirklich starten (tauri-driver + Edge-WebDriver des Runner-Images)
      - name: tauri-driver installieren
        if: ${{ !cancelled() }}
        run: cargo install tauri-driver --locked
      - name: Rauchtest der fertigen App
        if: ${{ !cancelled() }}
        run: |
          $drv = Join-Path $env:EDGEWEBDRIVER msedgedriver.exe
          & $drv --version
          $wv = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
          "WebView2-Laufzeit: $($wv.pv)"
          node tests/e2e/windows-smoke.mjs target/release/konturwerk.exe $drv konturwerk-windows.png
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: rauchtest-bild
          path: konturwerk-windows.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: konturwerk-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          retention-days: 14

[package]
name = "kw-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.23.1"
harfrust = "0.12.0"
i_overlay = "9.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
kurbo = "0.13"
lcms2 = { version = "6.2.0", features = ["static"] }
miniz_oxide = "0.9.1"
pdf-writer = "0.15.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
tiny-skia = "0.12.0"
usvg = "0.49.0"
visioncortex = "0.9.3"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
resvg = "0.49.0"
